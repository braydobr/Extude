<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Extude - Editar Usuário</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/css/estilo-global.css">

    <script>
        // Proteção de rota
        if (!localStorage.getItem('token') || localStorage.getItem('nivelAcesso') !== '0') {
            window.location.href = "../login.html";
        }
    </script>
</head>

<body class="layout-app edicao-layout">

    <div id="toast-notification" class="toast hidden">
        <i id="toast-icon" class="ph"></i>
        <span id="toast-message"></span>
    </div>

    <div class="app-container">

        <header class="header-central has-actions">
            <a href="gerenciar-usuarios.html" class="btn-square-action"><i class="ph ph-caret-left"></i></a>
            <h1 class="logo logo-sm"><span class="ex">EX</span><span class="tude">TUDE</span></h1>
            <button type="button" class="btn-square-action" onclick="excluirUsuario()" style="color: #ff4d4d;">
                <i class="ph ph-trash"></i>
            </button>
        </header>

        <div class="user-info" style="margin-top: 1.5rem;">
            <h2 class="user-name" id="titulo-id">Editar Usuário</h2>
            <p class="user-email" id="subtitulo-cpf">Carregando informações...</p>
        </div>

        <form id="form-editar-usuario" onsubmit="salvarUsuario(event)" style="display: none; margin-bottom: 100px;">
            
            <h3 class="menu-section-title">Dados Pessoais</h3>
            <div class="input-group-card">
                <div class="field">
                    <i class="ph ph-user"></i>
                    <label>Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="field">
                    <i class="ph ph-envelope"></i>
                    <label>E-mail</label>
                    <input type="email" id="email" required>
                </div>
            </div>

            <h3 class="menu-section-title">Permissões e Segurança</h3>
            <div class="input-group-card">
                
                <div class="accordion-item" id="acc-cargo">
                    <div class="accordion-header" onclick="toggleAccordion('acc-cargo')">
                        <div class="header-left">
                            <i class="ph ph-shield-check"></i>
                            <span id="selected-cargo">Selecionar Cargo</span>
                        </div>
                        <i class="ph ph-caret-down"></i>
                    </div>
                    <div class="accordion-content">
                        <ul>
                            <li onclick="selecionarCargo(1, 'Aluno')">Aluno</li>
                            <li onclick="selecionarCargo(0, 'Administrador')">Administrador</li>
                        </ul>
                    </div>
                </div>

                <div class="field">
                    <i class="ph ph-lock"></i>
                    <label>Nova Senha</label>
                    <input type="password" id="senha" placeholder="Deixe em branco para não alterar">
                </div>

                <input type="hidden" id="nivel_acesso_final" value="1">
            </div>

            <div class="btn-fixed-bottom">
                <button type="submit" class="btn-submit">
                    <i class="ph ph-floppy-disk"></i>Salvar Alterações
                </button>
            </div>

        </form>

        <p id="mensagem-carregando" style="text-align: center; color: #a0a0a0; padding: 3rem 1rem;">
            <i class="ph ph-spinner ph-spin" style="font-size: 1.5rem; margin-bottom: 0.5rem; display: block;"></i>
            Buscando dados do usuário...
        </p>

    </div>

    <script src="/js/script-global.js"></script>
    <script>
        let dadosUsuarioOriginal = null;
        const urlParams = new URLSearchParams(window.location.search);
        const usuarioId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!usuarioId) {
                mostrarAlerta("Usuário inválido.", "error");
                setTimeout(() => window.location.href = "gerenciar-usuarios.html", 1500);
                return;
            }
            await carregarDadosDoUsuario();
        });

        async function carregarDadosDoUsuario() {
            const token = localStorage.getItem('token');
            try {
                const resposta = await fetch('/admin/usuarios/listar', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!resposta.ok) throw new Error("Erro ao buscar lista de usuários.");

                const usuarios = await resposta.json();
                dadosUsuarioOriginal = usuarios.find(u => u.id == usuarioId);

                if (!dadosUsuarioOriginal) throw new Error("Usuário não encontrado.");

                // Preenche os textos de ID e CPF
                document.getElementById('titulo-id').innerText = `Editar Usuário #${dadosUsuarioOriginal.id}`;
                document.getElementById('subtitulo-cpf').innerText = `CPF: ${dadosUsuarioOriginal.cpf || 'Não informado'}`;

                // Preenche os campos do formulário
                document.getElementById('nome').value = dadosUsuarioOriginal.nome;
                document.getElementById('email').value = dadosUsuarioOriginal.email;
                
                // Configura o Cargo no Acordeon
                const nivelStr = dadosUsuarioOriginal.nivel === 0 ? 'Administrador' : 'Aluno';
                selecionarCargo(dadosUsuarioOriginal.nivel, nivelStr);

                document.getElementById('mensagem-carregando').style.display = 'none';
                document.getElementById('form-editar-usuario').style.display = 'block';

            } catch (erro) {
                mostrarAlerta(erro.message, "error");
                setTimeout(() => window.location.href = "gerenciar-usuarios.html", 2000);
            }
        }

        // Lógica do Acordeon
        function toggleAccordion(id) {
            const item = document.getElementById(id);
            const isActive = item.classList.contains('active');
            document.querySelectorAll('.accordion-item').forEach(acc => acc.classList.remove('active'));
            if (!isActive) item.classList.add('active');
        }

        function selecionarCargo(valor, texto) {
            document.getElementById('selected-cargo').innerText = texto;
            document.getElementById('nivel_acesso_final').value = valor;
            
            const item = document.getElementById('acc-cargo');
            if (item.classList.contains('active')) {
                toggleAccordion('acc-cargo');
            }
        }

        async function salvarUsuario(event) {
            event.preventDefault();
            const token = localStorage.getItem('token');
            const btnSubmit = document.querySelector('.btn-submit');
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="ph ph-spinner ph-spin"></i>Salvando...';

            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cpf: dadosUsuarioOriginal.cpf,
                senha: document.getElementById('senha').value || "senha_mantida_123",
                nivel_acesso: parseInt(document.getElementById('nivel_acesso_final').value)
            };

            try {
                const resposta = await fetch(`/admin/usuarios/${usuarioId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!resposta.ok) {
                    const erroData = await resposta.json();
                    throw new Error(erroData.detail || "Erro ao salvar.");
                }

                mostrarAlerta("Alterações salvas com sucesso!", "success");
                setTimeout(() => window.location.href = "gerenciar-usuarios.html", 1500);

            } catch (erro) {
                mostrarAlerta(erro.message, "error");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="ph ph-floppy-disk"></i>Salvar Alterações';
            }
        }

        async function excluirUsuario() {
            if (!confirm("⚠️ Excluir este usuário permanentemente?")) return;

            const token = localStorage.getItem('token');
            try {
                const resposta = await fetch(`/admin/usuarios/${usuarioId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resposta.status !== 204 && !resposta.ok) throw new Error("Erro ao excluir.");

                mostrarAlerta("Usuário removido!", "success");
                setTimeout(() => window.location.href = "gerenciar-usuarios.html", 1500);
            } catch (erro) {
                mostrarAlerta(erro.message, "error");
            }
        }
    </script>
</body>

</html>
